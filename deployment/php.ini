[PHP]
; PDF uploads are validated up to ~500MB in the app, so PHP must accept them.
post_max_size = 512M
upload_max_filesize = 500M
max_file_uploads = 20
; Parsing a 500MB multipart body can take longer than the old 5 seconds.
max_input_time = 300
expose_php = 0
memory_limit = 512M
realpath_cache_size = 32M
realpath_cache_ttl = 720
date.timezone = UTC

[Opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.use_cwd = 0
opcache.save_comments = 1
opcache.max_file_size = 0
opcache.max_accelerated_files = 32531
; Immutable container image: opcache is built at boot and never needs to stat
; files again.
opcache.validate_timestamps = 0
opcache.file_update_protection = 0
opcache.interned_strings_buffer = 16
opcache.enable_file_override = 1
opcache.file_cache_consistency_checks = 0
; Must be a directory (the old value was the literal string "60").
opcache.file_cache = /tmp/opcache-file-cache

[JIT]
; Disabled on purpose: the PHP 8.4 JIT segfaults (exit 139) when the amd64
; image is run under Rosetta on Apple Silicon, and it brings nothing to this
; IO-bound API (Ghostscript runs out of process).
opcache.jit = off
opcache.jit_buffer_size = 0

; zlib.output_compression was removed on purpose: Caddy already negotiates
; zstd/br/gzip, and double compression corrupts streamed/binary responses
; (PDF downloads) while burning CPU.
